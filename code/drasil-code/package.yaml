spec-version: 0.36.0
name:         drasil-code
version:      0.1.9.0
author:       "Dan Szymczak, Steven Palmer, Jacques Carette, Spencer Smith"
maintainer:   "Jacques Carette"
synopsis:     A framework for code and document generation for scientific software - Code SubPackage
github:       JacquesCarette/Drasil
homepage:     https://jacquescarette.github.io/Drasil/
description:  Please see the README on GitHub at <https://github.com/JacquesCarette/Drasil#readme>

language: GHC2024
default-extensions:
- StrictData
- StandaloneDeriving
- DerivingVia
- DeriveGeneric

extra-source-files: []

dependencies:
- base >= 4.7 && < 5
- lens
- containers
- pretty
- mtl
- directory
- filepath
- split
- drasil-file-handling
- drasil-gool
- drasil-metadata
- deriving-compat

ghc-options:
- -Wall
- -Wredundant-constraints
- -Wmissing-export-lists

library:
  dependencies:
  - drasil-database
  - drasil-lang
  - drasil-makefile
  - drasil-printers
  - drasil-srs
  - drasil-system
  - drasil-theory
  - drasil-utils
  source-dirs: lib
  exposed-modules:
  - Language.Drasil.Code
  - Language.Drasil.GOOL
  - Data.Drasil.ExternalLibraries.ODELibraries

tests:
  codegenTest:
    source-dirs: test
    main: Main
    ghc-options:
    - -threaded
    - -O2
    dependencies:
    - drasil-code
    - drasil-file-handling
    - drasil-testing-kit
    - tasty
