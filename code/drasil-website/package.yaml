spec-version: 0.36.0
name:         drasil-website
version:      0.1.0.0
github:       JacquesCarette/Drasil
maintainer:   "Jacques Carette"
synopsis:     Using the Drasil generators to create Drasil's website
homepage:     https://jacquescarette.github.io/Drasil/
description:  Please see the README on GitHub at <https://github.com/JacquesCarette/Drasil#readme>

language: Haskell2010
default-extensions:
- StrictData

ghc-options:
- -Wall
- -Wredundant-constraints
- -Wmissing-export-lists

extra-source-files: []

dependencies:
- base >= 4.7 && < 5
- containers
- lens
- split
- directory
- pretty
- drasil-gen
- drasil-lang
- sglpend
- dblpend
- gamephysics
- glassbr
- hghc
- swhsnopcm
- pdcontroller
- projectile
- ssp
- swhs
- bss
- template

library:
  dependencies:
  - drasil-code
  - drasil-data
  - drasil-database
  - drasil-file-handling
  - drasil-gool
  - drasil-printers
  - drasil-srs
  - drasil-system
  - drasil-data-formats
  source-dirs: lib

executables:
  website:
    main: Main
    source-dirs: app
    ghc-options:
    - -threaded
    - -O2
    dependencies:
    - drasil-website
