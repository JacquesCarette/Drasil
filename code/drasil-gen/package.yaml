name:                drasil-gen
version:             0.1.3.0
author:              "Dan Szymczak, Steven Palmer, Jacques Carette, Spencer Smith"
maintainer:          "Jacques Carette"
synopsis:            A framework for code and document generation for scientific software - Utils SubPackage
github:              JacquesCarette/Drasil
homepage:            https://jacquescarette.github.io/Drasil/
description:         Please see the README on GitHub at <https://github.com/JacquesCarette/Drasil#readme>

language: GHC2024
default-extensions:
- StrictData

extra-source-files: []

dependencies:
- base >= 4.7 && < 5
- aeson
- aeson-pretty
- bytestring
- filepath
- pretty
- containers
- directory
- time
- drasil-code
- drasil-data
- drasil-database
- drasil-document-writing
- drasil-file-handling
- drasil-gool
- drasil-lang
- drasil-makefile
- drasil-metadata
- drasil-printers
- drasil-srs
- drasil-system
- drasil-theory
- lens

ghc-options:
- -Wall
- -Wredundant-constraints
- -Wmissing-export-lists

library:
  source-dirs: lib
  exposed-modules:
  - Drasil.Generator
  when:
  - condition: false
    other-modules: Paths_drasil_gen
