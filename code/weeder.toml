roots = [
    # Program entries
    "Main.main",
    "ClassInstDepGen.main",
    "TypeDepGen.main",
    # .hie files don't record expressions from TH splices/quasi-quoters
    "^Drasil\\.Database\\.TH\\.declareHasChunkRefs$",
    "^Drasil\\.FileHandling\\.FilePath\\.ps$",
]

type-class-roots = false

root-instances = [
    # Common typeclasses
    { class = "\\.(Eq|Show|Ord|Enum|Bounded)$" },
    # Overloading-related typeclasses
    { class = "\\.(IsString|IsList)$" },
    # Metaprogramming-related
    { class = "\\.(Generic|Lift)$" },
    # DB-related
    { class = "\\.(HasChunkRefs|HasUID)$" },
]

root-modules = [
    # drasil-data
    "^Data\\.Drasil\\.",
    # drasil-data-formats and -database are internal libraries, strongly de-coupled from the rest
    "^Drasil\\.Database\\.",
    "^Drasil\\.Data\\.Formats\\.",
]

unused-types = true
